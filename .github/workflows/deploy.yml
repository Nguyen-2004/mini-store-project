name: Mini Store CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mini-store-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Backend, frontend and Docker verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mini_store
          POSTGRES_USER: mini_store
          POSTGRES_PASSWORD: TestDatabasePassword2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mini_store -d mini_store"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://mini_store:TestDatabasePassword2026@localhost:5432/mini_store?schema=public
      JWT_SECRET: ci-only-secret-with-at-least-32-characters-123456
      JWT_EXPIRES_IN: 2h
      CORS_ORIGIN: http://localhost:5173
      ADMIN_USERNAME: ci-admin
      ADMIN_EMAIL: ci-admin@example.test
      ADMIN_PASSWORD: CI-Only-Admin-Password-2026!
      ADMIN_FULL_NAME: CI Admin
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Check backend JavaScript
        run: npm run lint
        working-directory: backend
      - name: Audit production backend dependencies
        run: npm audit --omit=dev
        working-directory: backend
      - name: Validate schema and generate Prisma Client
        run: |
          npx prisma validate
          npm run db:generate
        working-directory: backend
      - name: Apply migrations and seed test data
        run: |
          npm run db:deploy
          npm run db:seed
        working-directory: backend
      - name: Backend API integration tests
        run: npm test
        working-directory: backend
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Audit frontend dependencies
        run: npm audit
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Build production
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - name: Build Docker image
        run: docker build --build-arg VITE_API_URL="$VITE_API_URL" -t mini-store-frontend:ci ./frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - name: Build backend Docker image
        run: docker build -t mini-store-backend:ci ./backend
      - name: Verify Nginx and SPA fallback
        shell: bash
        run: |
          docker run --rm mini-store-frontend:ci nginx -t
          docker run -d --name mini-store-ci -p 8080:80 mini-store-frontend:ci
          trap 'docker rm -f mini-store-ci' EXIT
          for attempt in {1..15}; do
            if curl --fail --silent http://localhost:8080/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:8080/health
          curl --fail --silent http://localhost:8080/ > /tmp/home.html
          for route in /products /products/ /admin/dashboard /user/dashboard /products/1; do
            curl --fail --silent "http://localhost:8080$route" > /tmp/route.html
            cmp /tmp/home.html /tmp/route.html
          done

  # TODO CD: thêm job deploy với needs: ci, chỉ chạy push vào main.
  # 1. Cấu hình GitHub Environment production và chính sách phê duyệt.
  # 2. Đăng nhập registry bằng secrets (DOCKERHUB_USERNAME / DOCKERHUB_TOKEN).
  # 3. Build/push image gắn tag github.sha; tránh chỉ dùng latest.
  # 4. Triển khai image trên server bằng thông tin SSH lưu trong secrets.
  # 5. Kiểm tra /health; rollback về tag trước nếu triển khai thất bại.
  # Chưa có registry/server: workflow chỉ CI, không tự triển khai.
