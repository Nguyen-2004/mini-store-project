services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mini_store_ci
      POSTGRES_USER: mini_store_ci
      POSTGRES_PASSWORD: ci-only-db-password
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
